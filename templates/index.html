{% extends "base.html" %}

{% block title %}Todo — Productivity App{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto px-6 py-10">

  <!-- Page heading -->
  <h1 class="text-2xl font-display font-medium text-gray-700 mb-8">My Tasks</h1>

  <!-- ── ADD TASK FORM ─────────────────────────────────────────────────── -->
  <form action="/todo/add" method="POST" class="flex gap-3 mb-8">
    <input
      type="text"
      name="todo_text"
      id="todo_text"
      placeholder="Add a task..."
      required
      autocomplete="off"
      class="flex-1 border border-gray-300 rounded-lg px-4 py-3 text-sm text-gray-800
             placeholder-gray-400 outline-none shadow-sm
             focus:ring-2 focus:ring-yellow-400 focus:border-transparent transition"
    />
    <button
      type="submit"
      class="bg-yellow-400 hover:bg-yellow-500 text-gray-800 font-medium text-sm
             px-5 py-3 rounded-lg shadow-sm transition"
    >
      Add
    </button>
  </form>

  <!-- ── TASK LIST ─────────────────────────────────────────────────────── -->
  {% if todos %}
  <ul class="space-y-2">
    {% for todo in todos %}
    <li class="flex items-center gap-3 bg-white border border-gray-200 rounded-xl
               px-4 py-3 shadow-sm hover:shadow-md transition group">

      <!-- Checkbox toggle -->
      <form action="/todo/toggle/{{ todo.id }}" method="POST">
        <button type="submit" class="flex-shrink-0" title="Toggle complete">
          <span class="material-icons text-2xl
                       {% if todo.done %}text-yellow-500{% else %}text-gray-300 group-hover:text-gray-400{% endif %}">
            {% if todo.done %}check_circle{% else %}radio_button_unchecked{% endif %}
          </span>
        </button>
      </form>

      <!-- Task text -->
      <span class="flex-1 text-sm text-gray-700
                   {% if todo.done %}line-through text-gray-400{% endif %}">
        {{ todo.text }}
      </span>

      <!-- Delete button -->
      <form action="/todo/delete/{{ todo.id }}" method="POST">
        <button
          type="submit"
          title="Delete task"
          class="opacity-0 group-hover:opacity-100 transition"
        >
          <span class="material-icons text-lg text-gray-400 hover:text-red-400">close</span>
        </button>
      </form>

    </li>
    {% endfor %}
  </ul>

  {% else %}
  <!-- Empty state -->
  <div class="flex flex-col items-center justify-center text-center mt-24 select-none">
    <span class="material-icons text-8xl text-gray-200 mb-4">check_circle</span>
    <p class="text-gray-400 text-base">Tasks that you add appear here</p>
  </div>
  {% endif %}

</div>

{% endblock %}
