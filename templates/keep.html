{% extends "base.html" %}

{% block title %}Notes — Productivity App{% endblock %}

{% block content %}

<div class="px-6 py-10">

  <!-- ── "TAKE A NOTE" INPUT BOX ──────────────────────────────────────── -->
  <div class="max-w-xl mx-auto mb-10">
    <form action="/notes/add" method="POST" id="note-form">

      <!--
        note-box background changes live as the user picks a color.
        We start with a plain white background.
        The inline style is updated by the JS selectColor() function.
      -->
      <div id="note-box"
           class="rounded-xl shadow-md border border-gray-200 px-5 py-4 cursor-text transition-colors duration-200"
           style="background-color: #ffffff;">

        <!-- Collapsed state: single "Take a note..." line -->
        <div id="note-placeholder" class="text-gray-500 text-sm" onclick="expandNote()">
          Take a note...
        </div>

        <!-- Expanded state (hidden by default) -->
        <div id="note-expanded" class="hidden flex flex-col gap-3">

          <!-- Text area -->
          <textarea
            name="note_body"
            id="note_body"
            rows="4"
            placeholder="Take a note..."
            class="w-full text-sm text-slate-800 outline-none resize-none placeholder-gray-400 bg-transparent"
          ></textarea>

          <!-- Bottom toolbar: palette icon on the left, buttons on the right -->
          <div class="flex items-center justify-between">

            <!-- ── COLOR PALETTE SECTION ──────────────────────────────── -->
            <div class="relative">

              <!-- Palette trigger button -->
              <button
                type="button"
                id="palette-btn"
                onclick="togglePalette(event)"
                title="Change note color"
                class="flex items-center justify-center w-8 h-8 rounded-full
                       hover:bg-black/10 transition text-gray-500 hover:text-gray-700"
              >
                <span class="material-icons text-xl">palette</span>
              </button>

              <!--
                Color swatches popup.
                Positioned just above the palette button.
                Starts hidden; JS toggles the 'hidden' class.
              -->
              <div
                id="color-popup"
                class="hidden absolute bottom-10 left-0 flex gap-2
                       bg-white border border-gray-200 shadow-lg rounded-xl p-2 z-10"
              >
                <!--
                  Each swatch calls selectColor('#hexcode').
                  The ring on the "default white" swatch is shown by default
                  because it starts as the active color.
                  We use a border + ring trick so the active swatch is visually clear.
                -->

                <!-- White (default) -->
                <button type="button" onclick="selectColor('#ffffff')"
                  title="Default"
                  class="color-swatch w-7 h-7 rounded-full border-2 border-gray-300 hover:scale-110 transition"
                  style="background-color: #ffffff;"
                ></button>

                <!-- Pale yellow -->
                <button type="button" onclick="selectColor('#fff9c4')"
                  title="Yellow"
                  class="color-swatch w-7 h-7 rounded-full border-2 border-transparent hover:scale-110 transition"
                  style="background-color: #fff9c4;"
                ></button>

                <!-- Soft blue -->
                <button type="button" onclick="selectColor('#bbdefb')"
                  title="Blue"
                  class="color-swatch w-7 h-7 rounded-full border-2 border-transparent hover:scale-110 transition"
                  style="background-color: #bbdefb;"
                ></button>

                <!-- Mint green -->
                <button type="button" onclick="selectColor('#c8e6c9')"
                  title="Green"
                  class="color-swatch w-7 h-7 rounded-full border-2 border-transparent hover:scale-110 transition"
                  style="background-color: #c8e6c9;"
                ></button>

                <!-- Light pink -->
                <button type="button" onclick="selectColor('#f8bbd0')"
                  title="Pink"
                  class="color-swatch w-7 h-7 rounded-full border-2 border-transparent hover:scale-110 transition"
                  style="background-color: #f8bbd0;"
                ></button>

              </div><!-- end #color-popup -->
            </div><!-- end palette wrapper -->

            <!--
              Hidden input that carries the chosen color to the Flask backend.
              JS keeps this in sync with whatever the user clicks.
            -->
            <input type="hidden" name="note_color" id="note_color" value="#ffffff" />

            <!-- Close / Done buttons -->
            <div class="flex gap-2">
              <button
                type="button"
                onclick="collapseNote()"
                class="text-sm text-gray-500 hover:text-gray-700 px-3 py-1 rounded-lg hover:bg-black/5 transition"
              >Close</button>
              <button
                type="submit"
                class="text-sm font-medium text-gray-700 px-3 py-1 rounded-lg hover:bg-black/5 transition"
              >Done</button>
            </div>

          </div><!-- end toolbar -->
        </div><!-- end #note-expanded -->

      </div><!-- end #note-box -->
    </form>
  </div>


  <!-- ── NOTES MASONRY GRID ──────────────────────────────────────────── -->
  {% if notes %}

  <!--
    CSS columns create a true masonry layout: cards fill the shortest column
    automatically, just like Pinterest / Google Keep, with no JS library.

    Responsive breakpoints:
      < 640px  → 1 column
      640–900px → 2 columns
      > 900px  → 3 columns

    We set these via inline styles + a small <style> block below because
    Tailwind's responsive prefixes don't apply to inline styles.
  -->
  <style>
    .notes-masonry { column-count: 1; column-gap: 12px; }
    @media (min-width: 640px)  { .notes-masonry { column-count: 2; } }
    @media (min-width: 900px)  { .notes-masonry { column-count: 3; } }
  </style>

  <div class="notes-masonry" style="max-width: 960px; margin: 0 auto;">
    {% for note in notes %}

    <!--
      group    → lets child elements react to hover on this card via group-hover:
      relative → positions the hover toolbar correctly inside the card
    -->
    <div class="break-inside-avoid border border-gray-200 rounded-xl
                shadow-sm hover:shadow-md transition-shadow duration-200
                flex flex-col mb-3 group relative overflow-hidden"
         style="background-color: {{ note.color }};">

      <!-- Note body text — give bottom padding so toolbar doesn't overlap text -->
      <p class="text-sm text-slate-800 whitespace-pre-wrap leading-relaxed p-4 pb-2">
        {{ note.body }}
      </p>

      <!--
        Hover action toolbar — sits at the very bottom of the card.
        opacity-0 → invisible by default.
        group-hover:opacity-100 → fades in when the card is hovered.
        The toolbar has the same background as the card so it blends in.
      -->
      <div class="flex items-center justify-end px-2 py-1
                  opacity-0 group-hover:opacity-100 transition-opacity duration-150">

        <!-- Trash / delete button -->
        <form action="/notes/delete/{{ note.id }}" method="POST">
          <button
            type="submit"
            title="Delete note"
            class="flex items-center justify-center w-8 h-8 rounded-full
                   hover:bg-black/10 transition text-gray-400 hover:text-red-500"
          >
            <!--
              'delete' is the filled trash-can icon in Material Icons.
              'delete_outline' gives a lighter outlined version — pick your preference.
            -->
            <span class="material-icons text-[18px]">delete</span>
          </button>
        </form>

      </div><!-- end hover toolbar -->
    </div>
    {% endfor %}
  </div>

  {% else %}

  <!-- Empty state -->
  <div class="flex flex-col items-center justify-center text-center mt-28 select-none">
    <span class="material-icons text-gray-200 mb-4" style="font-size: 120px;">lightbulb</span>
    <p class="text-gray-400 text-base">Notes that you add appear here</p>
  </div>

  {% endif %}
</div>


<!-- ── JAVASCRIPT ─────────────────────────────────────────────────────── -->
<script>

  // ── Expand / collapse the note input box ────────────────────────────

  function expandNote() {
    document.getElementById('note-placeholder').classList.add('hidden');
    document.getElementById('note-expanded').classList.remove('hidden');
    document.getElementById('note_body').focus();
  }

  function collapseNote() {
    document.getElementById('note-expanded').classList.add('hidden');
    document.getElementById('note-placeholder').classList.remove('hidden');
    // Reset text and color so the box is fresh for the next note
    document.getElementById('note_body').value = '';
    selectColor('#ffffff');
    closePalette();
  }


  // ── Color palette ────────────────────────────────────────────────────

  function togglePalette(event) {
    // Stop the click from bubbling up to the document listener that closes it
    event.stopPropagation();
    document.getElementById('color-popup').classList.toggle('hidden');
  }

  function closePalette() {
    document.getElementById('color-popup').classList.add('hidden');
  }

  // Close the palette if the user clicks anywhere outside of it
  document.addEventListener('click', function () {
    closePalette();
  });

  function selectColor(hex) {
    // 1. Update the hidden form field so Flask receives the color
    document.getElementById('note_color').value = hex;

    // 2. Change the note box background live so the user sees a preview
    document.getElementById('note-box').style.backgroundColor = hex;

    // 3. Highlight the active swatch with a gray border; clear all others
    document.querySelectorAll('.color-swatch').forEach(function (swatch) {
      var swatchColor = swatch.style.backgroundColor;

      // Convert our hex to the rgb() format the browser uses internally
      // so we can compare apples-to-apples
      if (hexToRgb(hex) === swatchColor) {
        swatch.style.borderColor = '#9e9e9e'; // active swatch gets a ring
      } else {
        swatch.style.borderColor = 'transparent';
      }
    });

    // Keep white's border visible (it has a light gray border by default)
    // so it doesn't disappear against the white background
    document.querySelectorAll('.color-swatch').forEach(function (swatch) {
      if (swatch.style.backgroundColor === 'rgb(255, 255, 255)' &&
          hex !== '#ffffff') {
        swatch.style.borderColor = '#d1d5db'; // subtle gray so you can see the white swatch
      }
    });

    closePalette();
  }

  // Helper: turn "#rrggbb" into "rgb(r, g, b)" for comparison with computed styles
  function hexToRgb(hex) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgb(' + r + ', ' + g + ', ' + b + ')';
  }

</script>

{% endblock %}
